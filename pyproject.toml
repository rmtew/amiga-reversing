[project]
name = "amiga-reversing2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pymupdf>=1.27.2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
amiga-analyze-disk = "amiga_reversing.tools.analyze_disk:main"
amiga-benchmark-target = "amiga_reversing.tools.benchmark_target:main"
amiga-check-mojibake = "amiga_reversing.tools.check_mojibake:main"
amiga-disasm-server = "amiga_reversing.tools.disasm_server:main"
amiga-genam-roundtrip = "amiga_reversing.tools.genam_roundtrip:main"
amiga-gen-disasm = "amiga_reversing.tools.gen_disasm:main"
amiga-import-adf = "amiga_reversing.tools.import_adf:main"
amiga-manual-actions = "amiga_reversing.tools.manual_actions:main"
amiga-m68k-coverage = "amiga_reversing.tools.m68k_coverage:main"
amiga-platform-kb = "amiga_reversing.tools.platform_kb:main"
atari-platform-kb = "amiga_reversing.tools.atari_platform_kb:main"
macos-platform-kb = "amiga_reversing.tools.macos_platform_kb:main"
amiga-precommit = "amiga_reversing.tools.precommit:main"
amiga-reproduction-profiles = "amiga_reversing.tools.reproduction_profiles:main"
amiga-source-export = "amiga_reversing.tools.source_export:main"
amiga-tool-registry = "amiga_reversing.tools.tool_registry:main"
amiga-vasm-roundtrip = "amiga_reversing.tools.vasm_roundtrip:main"
amiga-validate-target-seeded-metadata = "amiga_reversing.tools.validate_target_seeded_metadata:main"
amiga-winuae-session = "amiga_reversing.tools.winuae_session:main"

[dependency-groups]
dev = [
    "machine68k",
    "mypy>=1.18",
    "pytest>=8",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "web_e2e: Brave/CDP browser integration tests",
]

[tool.mypy]
python_version = "3.14"
strict = true
follow_imports = "skip"
files = [
    "amiga_reversing/amiga_disk",
    "amiga_reversing/disasm",
    "amiga_reversing/tools",
]

[tool.ruff]
target-version = "py314"
include = [
    "amiga_reversing/**/*.py",
    "tests/**/*.py",
]

[tool.ruff.lint]
select = ["E9", "F", "B", "UP", "I", "C4", "PT", "PIE", "RET", "SIM", "RUF013", "RUF020", "RUF100"]
ignore = ["PT018"]

[tool.uv]
exclude-newer = "7 days"

[tool.setuptools.packages.find]
include = ["amiga_reversing*"]

[tool.setuptools.package-data]
"amiga_reversing.web" = ["*.html", "*.css", "*.js"]

[tool.uv.sources]
machine68k = { path = "resources/machine68k/dist/machine68k-0.4.2.dev0+g61600df53.d20260308-cp314-cp314-win_amd64.whl" }
